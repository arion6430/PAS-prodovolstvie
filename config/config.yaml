# Основная конфигурация системы прогноза цен на плодоовощную продукцию.
# Справочники соответствия (мастер-данные) — в config/products.csv и config/regions.csv.

http:
  timeout_sec: 120          # таймаут одного запроса
  retries: 4                # число повторов при сбое / 429 / 5xx
  backoff_sec: 5            # базовая пауза, растёт экспоненциально
  min_interval_sec: 1.0     # минимальный интервал между запросами к одному хосту
  user_agent: "Mozilla/5.0 (food-prices study project)"

sources:
  emiss_retail:
    enabled: true
    indicator_id: 31448      # Средние потребительские цены (тарифы) на товары и услуги
    start_year: 2000
    reload_years: 2          # сколько последних лет перезапрашивать (ловим ревизии Росстата)
  emiss_producer:
    enabled: true
    indicator_id: 57693      # Средние цены производителей с/х продукции с 2017 г.
    start_year: 2017
    reload_years: 2
  cbr_fx:
    enabled: true
    start_date: "2000-01-01"
    currencies:              # код валюты ЦБ -> обозначение
      R01235: USD
      R01239: EUR
      R01375: CNY
  cbr_key_rate:
    enabled: true
    start_date: "2013-09-13"
  openmeteo:
    enabled: true
    http:                    # бесплатный API считает «вес» запроса по объёму данных и ограничивает его в минуту
      min_interval_sec: 15
      backoff_sec: 30        # пауза 30 → 60 → 120 с при ответе 429
    start_date: "2000-01-01"
    overlap_days: 10         # последние дни архива предварительные — перезапрашиваем
    variables: [temperature_2m_mean, precipitation_sum]
    # точки наблюдения — справочник dbt/seeds/weather_points.csv
