# Полный стенд: PostgreSQL (хранилище + метаданные сервисов), Airflow (оркестрация, dbt внутри), Superset (BI).
# Запуск:  docker compose up -d --build
name: foodprices

x-airflow-common: &airflow-common
  build: docker/airflow
  image: foodprices-airflow:local
  user: "${AIRFLOW_UID:-50000}:0"
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__DAGS_FOLDER: /opt/foodprices/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER}:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Moscow
    # код проекта монтируется целиком, загрузчики импортируются из src
    FOODPRICES_HOME: /opt/foodprices
    PYTHONPATH: /opt/foodprices/src
    WAREHOUSE_HOST: postgres
    WAREHOUSE_PORT: "5432"
    DBT_PROFILES_DIR: /opt/foodprices/dbt
    DBT_PROJECT_DIR: /opt/foodprices/dbt
  volumes:
    - ./:/opt/foodprices
    - airflow-logs:/opt/airflow/logs
    - airflow-auth:/opt/airflow/auth
  restart: unless-stopped
  depends_on:
    airflow-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      WAREHOUSE_DB: ${WAREHOUSE_DB}
      WAREHOUSE_USER: ${WAREHOUSE_USER}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
      BI_READER_USER: ${BI_READER_USER}
      BI_READER_PASSWORD: ${BI_READER_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # Однократная инициализация: метаданные Airflow, пароль администратора, миграции хранилища
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        echo '{"${AIRFLOW_ADMIN_USER}": "${AIRFLOW_ADMIN_PASSWORD}"}' > /opt/airflow/auth/passwords.json
        airflow db migrate
        python -m foodprices migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor

  # --- Superset: BI поверх витрин ---
  superset-init:
    build: docker/superset
    image: foodprices-superset:local
    env_file: .env
    command:
      - /bin/sh
      - -c
      - |
        set -e
        superset db upgrade
        superset fab create-admin --username "$${SUPERSET_ADMIN_USER}" --password "$${SUPERSET_ADMIN_PASSWORD}" \
          --firstname Admin --lastname Admin --email admin@example.com || true
        superset init
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  superset:
    image: foodprices-superset:local
    env_file: .env
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8088/health || exit 1"]
      interval: 10s
      retries: 30
    depends_on:
      superset-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Дашборды как код: подключение к хранилищу, датасеты, графики и дашборды создаются скриптом через REST API.
  # Ждёт появления витрин (их строит dbt в первом запуске DAG) и обновляет объекты идемпотентно.
  superset-bootstrap:
    image: foodprices-superset:local
    env_file: .env
    environment:
      SUPERSET_URL: http://superset:8088
    volumes:
      - ./superset:/app/bootstrap:ro
    command: ["/app/.venv/bin/python", "/app/bootstrap/bootstrap.py"]
    depends_on:
      superset:
        condition: service_healthy
    restart: on-failure:20

volumes:
  pgdata:
  airflow-logs:
  airflow-auth:
